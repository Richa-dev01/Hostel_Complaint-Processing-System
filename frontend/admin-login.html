<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Login - Smart Hostel Complaint System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Smart Hostel Complaint System</h1>
    <p>Admin portal</p>
  </header>

  <main class="narrow">
    <section class="card">
      <h2>Admin Login</h2>
      <form id="adminLoginForm">
        <label>Email
          <input type="email" id="adminEmail" required>
        </label>
        <label>Password
          <input type="password" id="adminPassword" required>
        </label>
        <button type="submit">Log in</button>
        <p id="adminMsg"></p>
      </form>
      <p class="hint"><a href="login.html">Back to student login</a></p>
    </section>
  </main>

  <script src="admin-login.js"></script>
</body>
</html>
