<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Dashboard - Smart Hostel Complaint System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Smart Hostel Complaint System</h1>
    <p>Welcome, <span id="userName"></span>
      <button id="logoutBtn" type="button" class="logout">Log out</button>
    </p>
  </header>

  <main>
    <section class="card">
      <h2>Register a Complaint</h2>
      <form id="complaintForm">
        <label>Room number
          <input type="text" id="roomNo" placeholder="e.g. 204">
        </label>

        <label>Category
          <select id="categoryId">
            <option value="1">Electrical</option>
            <option value="2">Plumbing</option>
            <option value="3">Cleaning</option>
            <option value="4">Wi-Fi/Internet</option>
            <option value="5">Furniture</option>
            <option value="6">Water supply</option>
            <option value="7">Maintenance</option>
            <option value="8">Other</option>
          </select>
        </label>

        <label>Priority
          <select id="priority">
            <option value="LOW">Low</option>
            <option value="MEDIUM">Medium</option>
            <option value="HIGH">High</option>
          </select>
        </label>

        <label>Description
          <textarea id="description" rows="3" placeholder="Describe the problem"></textarea>
        </label>

        <button type="submit">Submit Complaint</button>
        <p id="message"></p>
      </form>
    </section>

    <section class="card">
      <h2>My Complaints</h2>
      <button id="refreshBtn" type="button">Refresh</button>
      <table>
        <thead>
          <tr>
            <th>ID</th><th>Room</th><th>Category</th>
            <th>Description</th><th>Priority</th><th>Status</th><th>Assigned to</th><th>Remarks</th><th>Date</th>
          </tr>
        </thead>
        <tbody id="complaintRows"></tbody>
      </table>
      <p id="emptyMsg" class="hint"></p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
